name: mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  pdf: ^3.11.1
  supabase_flutter: ^2.5.0
  share_plus: ^13.3.0
  file_picker: ^12.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.2
  sqlite3_flutter_libs: ^0.5.24
  flutter:
    sdk: flutter
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.20.0
  sqlite3: ^2.4.0
  timezone: ^0.9.4
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.0.0
  logger: ^2.0.0
  domain:
    path: ../../packages/domain
  flutter_secure_storage: ^11.0.0
  encrypt: ^5.0.3
  crypto: ^3.0.3
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^17.2.3

  intl: any

  connectivity_plus: ^6.0.0
dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48

  